[project]
name = "solfv-payment-gateway"
version = "0.1.0"
description = "Devnet-only Solana payment gateway for Solfv analysis access"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
payments = [
  "solders>=0.26,<1",
  "x402[fastapi,svm]>=2,<3",
]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
